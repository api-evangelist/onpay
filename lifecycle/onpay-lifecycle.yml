  current: v2
  spec_version: 2.0.0
  docs: https://onpay.readme.io/reference/versioning
  policy: >-
    "Versioning in the OnPay API is achieved in the url, e.g. https://onpaydev.com/:version/example.
    When building an application against a specific version of the API, partners can feel confident
    that the behavior of that version will not change as long as that version is supported. Changes
    that would break an existing version utilization will be applied to a new version."
  supported_versions_published: false
  note: >-
    A v1 path still answers on the production host (https://api.onpay.com/v1/employees returns the same
    authorization error envelope as v2), but OnPay publishes no list of supported versions and no end
    date for any of them.
