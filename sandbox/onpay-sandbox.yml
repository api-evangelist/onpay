summary: >-
  OnPay's authorization documentation tells partners to develop against the demo domain onpaydev.com.
  That domain is no longer OnPay's: it now serves a GoDaddy domain-parking lander on every path. The
  same dead host is the only entry in the published OpenAPI's servers[] array
  (https://onpaydev.com/v2), so a developer or agent that reads the spec and calls the declared server
  reaches a parking page rather than an API. No Sandbox pointer is wired into apis.yml, because there
  is no reachable sandbox to point at.
