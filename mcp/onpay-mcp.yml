note: >-
  OnPay publishes NO MCP server. Searched the docs hub (its own llms.txt enumerates every page — one guide
  and the API reference, nothing agent-related), npm (the only "onpay" MCP package, @fatomate/onpay-mcp,
  is an unofficial community server for a DIFFERENT company's OnPay API and says so in its own README),
  PyPI, RubyGems and Packagist, plus /mcp and /sse on onpay.com, api.onpay.com, app.onpay.com and mcp.onpay.com
  — nothing answered. The tool set below is a CANDIDATE surface derived one-per-operation from the live
  OnPay API 2.0.0 OpenAPI: what an MCP server for this API could expose, each tool's real input schema
  inherited from the referenced operation's parameters and requestBody. This is a design artifact, not
  a provider claim. No MCPServer pointer is wired into apis.yml and none should be until OnPay actually
  ships one.
