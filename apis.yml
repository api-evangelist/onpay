aid: onpay
name: OnPay
description: >-
  OnPay is an Atlanta, Georgia based provider of full-service online payroll, HR, and employee benefits
  software for small and mid-size US businesses, founded in 2011 and funded by Carrick Capital Partners.
  The platform runs payroll and direct deposit, files federal, state, and local payroll taxes, and handles
  onboarding, PTO, org charts, health insurance, 401(k), and workers' compensation. For developers, OnPay
  publishes a partner-only REST API (v2) documented on a public ReadMe hub, covering employees, employee
  deductions, wages, leave, tax fields, bank accounts, terminations and rehires, company worksites,
  locations, departments and positions, pay schedules, and payroll reporting. Access is limited to
  approved partners, authorized with OAuth 2.0 authorization-code grants against app.onpay.com and
  role-scoped bearer tokens.
