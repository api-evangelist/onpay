apis:
- name: OnPay API
  description: >-
    Partner-only REST API (version 2.0.0) for OnPay's payroll and HR platform. 58 operations across six
    tags — Employees, Company, Deductions, Pay-runs, Reports, and User — covering employee CRUD, employee
    deductions and scheduled deduction changes, wages and scheduled wage changes, leave, tax fields, bank
    accounts, terminations and rehires, company worksites, locations, departments, positions, deduction
    groupings, pay schedules and pay-schedule dates, unprocessed hours, and payroll/retirement reporting.
    Authorization is OAuth 2.0 authorization code with six role scopes; every request carries a bearer
    access token valid for two hours. Object writes use an optimistic-concurrency `version` field.
  humanURL: https://onpay.readme.io/reference/authorization
  baseURL: https://api.onpay.com/v2
